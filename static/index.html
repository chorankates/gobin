<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corporate Bingo</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        .game-container {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            margin: 20px auto;
        }
        .bingo-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            width: 600px;
        }
        .bingo-tile {
            aspect-ratio: 1;
            border: 1px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            background-color: white;
            font-size: 0.9em;
            word-wrap: break-word;
            overflow: hidden;
            transition: background-color 0.2s ease;
        }
        .bingo-tile.marked {
            background-color: #90EE90;
        }
        .bingo-tile.loading {
            background-color: #e0e0e0;
            cursor: not-allowed;
        }
        .win-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            display: none;
            z-index: 1000;
        }
        .win-message.show {
            display: block;
        }
        .win-message h2 {
            margin: 0 0 10px 0;
            color: #90EE90;
        }
        .win-message button {
            background-color: #90EE90;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        .win-message button:hover {
            background-color: #7ED321;
        }
        .player-info {
            background-color: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            min-width: 200px;
        }
        .player-info h2 {
            margin-top: 0;
            color: #333;
        }
        .player-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .player-list li {
            padding: 5px 0;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .player-list li:last-child {
            border-bottom: none;
        }
        .player-name {
            font-weight: bold;
            color: #666;
        }
        .tile-count {
            background-color: #90EE90;
            color: #333;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.9em;
        }
        .name-prompt {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            text-align: center;
        }
        .name-prompt input {
            padding: 8px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 200px;
        }
        .name-prompt button {
            background-color: #90EE90;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        .name-prompt button:hover {
            background-color: #7ED321;
        }
        .name-prompt.hidden {
            display: none;
        }
        .mini-board {
            display: grid;
            grid-template-columns: repeat(4, 12px);
            grid-gap: 2px;
            margin-left: 10px;
        }
        .mini-tile {
            width: 12px;
            height: 12px;
            background: #eee;
            border: 1px solid #ccc;
            display: inline-block;
            border-radius: 2px;
        }
        .mini-tile.marked {
            background: #90EE90;
            border: 1px solid #7ED321;
        }
    </style>
</head>
<body>
    <div class="name-prompt" id="namePrompt">
        <h2>Enter Your Name</h2>
        <input type="text" id="nameInput" placeholder="Your name" maxlength="20" onkeypress="handleNameKeyPress(event)">
        <button onclick="setName()">Start Playing</button>
    </div>
    <h1>Corporate Bingo</h1>
    <div class="game-container">
        <div class="bingo-board" id="bingoBoard">
            <!-- Tiles will be added dynamically -->
        </div>
        <div class="player-info">
            <h2>Players</h2>
            <div class="player-name" id="playerName"></div>
            <h3>Connected Players</h3>
            <ul class="player-list" id="playerList">
                <!-- Player list will be added dynamically -->
            </ul>
        </div>
    </div>
    <div class="win-message" id="winMessage">
        <h2>BINGO!</h2>
        <p id="winText">You won!</p>
        <button onclick="resetGame()">New Game</button>
    </div>
    <script src="js/messages.js"></script>
    <script>
        let ws;
        let board = Array(16).fill(false);
        let words = [];
        let playerName = "";
        let clickTimeout = null;
        let pendingClicks = new Map();
        let sequenceNumber = 0;

        function getNameFromCookie() {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                const [name, value] = cookie.trim().split('=');
                if (name === 'playerName') {
                    return decodeURIComponent(value);
                }
            }
            return null;
        }

        function handleNameKeyPress(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                setName();
            }
        }

        function setName() {
            const nameInput = document.getElementById('nameInput');
            const name = nameInput.value.trim();
            if (name) {
                // Set cookie that expires in 1 year
                const expiryDate = new Date();
                expiryDate.setFullYear(expiryDate.getFullYear() + 1);
                document.cookie = `playerName=${encodeURIComponent(name)};expires=${expiryDate.toUTCString()};path=/;SameSite=Lax`;
                document.getElementById('namePrompt').classList.add('hidden');
                connect();
            }
        }

        // Check for existing name when page loads
        window.onload = function() {
            playerName = getNameFromCookie();
            if (playerName) {
                document.getElementById('namePrompt').classList.add('hidden');
                connect();
            } else {
                document.getElementById('namePrompt').classList.remove('hidden');
            }
            initBoard();
        };

        function connect() {
            ws = new WebSocket('ws://' + window.location.host + '/ws');
            
            ws.onopen = function() {
                console.log('Connected to server');
                // Send player name to server
                ws.send(JSON.stringify({
                    type: MessageType.SET_NAME,
                    name: playerName
                }));
                // Clear any pending clicks when reconnected
                pendingClicks.clear();
                updateBoardDisplay();
            };
            
            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                console.log('Received WebSocket message:', data);
                switch(data.type) {
                    case MessageType.INIT_BOARD:
                        console.log('Processing INIT_BOARD message');
                        board = data.board;
                        words = data.words;
                        playerName = data.name;
                        document.getElementById('playerName').textContent = `You are: ${playerName}`;
                        updateBoardDisplay();
                        break;
                    case MessageType.TILE_MARKED:
                        console.log('Processing TILE_MARKED message');
                        // Only process if this is the expected sequence number
                        const pendingClick = pendingClicks.get(data.index);
                        if (pendingClick && pendingClick.sequence === data.sequence) {
                            board = data.board;
                            pendingClicks.delete(data.index);
                            updateBoardDisplay();
                            if (data.win) {
                                showWinMessage(true);
                            }
                        } else {
                            console.log('Ignoring out-of-order message for tile', data.index);
                        }
                        break;
                    case MessageType.PLAYER_WON:
                        console.log('Processing PLAYER_WON message');
                        showWinMessage(false, data.name);
                        break;
                    case MessageType.CLIENT_LIST:
                        console.log('Processing CLIENT_LIST message:', data.clients);
                        updatePlayerList(data.clients);
                        break;
                }
            };
            
            ws.onclose = function() {
                console.log('Disconnected from server');
                // Try to reconnect after 5 seconds
                setTimeout(connect, 5000);
            };

            ws.onerror = function(error) {
                console.error('WebSocket error:', error);
                // Clear any pending clicks on error
                pendingClicks.clear();
                updateBoardDisplay();
            };
        }

        function updatePlayerList(clients) {
            console.log('Updating player list with:', clients);
            const playerList = document.getElementById('playerList');
            playerList.innerHTML = '';
            Object.entries(clients).forEach(([name, board]) => {
                const li = document.createElement('li');
                const nameSpan = document.createElement('span');
                nameSpan.textContent = name;
                nameSpan.className = 'player-name';
                li.appendChild(nameSpan);
                // Add a mini-board for each player
                const miniBoard = document.createElement('div');
                miniBoard.className = 'mini-board';
                for (let i = 0; i < 16; i++) {
                    const tile = document.createElement('span');
                    tile.className = 'mini-tile' + (board[i] ? ' marked' : '');
                    miniBoard.appendChild(tile);
                }
                li.appendChild(miniBoard);
                playerList.appendChild(li);
            });
        }

        function showWinMessage(isWinner, winnerName) {
            const winMessage = document.getElementById('winMessage');
            const winText = document.getElementById('winText');
            winText.textContent = isWinner ? 'You won!' : `${winnerName} won!`;
            winMessage.classList.add('show');
        }

        function resetGame() {
            board = Array(16).fill(false);
            updateBoardDisplay();
            document.getElementById('winMessage').classList.remove('show');
        }

        function updateBoardDisplay() {
            console.log('Updating board display. Board state:', board);
            for (let i = 0; i < board.length; i++) {
                const tile = document.getElementById(`tile-${i}`);
                if (tile) {
                    const wasMarked = tile.classList.contains('marked');
                    const shouldBeMarked = board[i];
                    const isPending = pendingClicks.has(i);
                    console.log(`Tile ${i}: wasMarked=${wasMarked}, shouldBeMarked=${shouldBeMarked}, isPending=${isPending}`);
                    
                    // Remove all states first
                    tile.classList.remove('marked', 'loading');
                    
                    // Apply appropriate state
                    if (isPending) {
                        tile.classList.add('loading');
                    } else if (shouldBeMarked) {
                        tile.classList.add('marked');
                    }
                    
                    tile.textContent = words[i] || `Tile ${i + 1}`;
                }
            }
        }

        function markTile(index) {
            console.log('Marking tile:', index, 'Current board state:', board);
            
            // If already pending or WebSocket not ready, ignore click
            if (pendingClicks.has(index) || !ws || ws.readyState !== WebSocket.OPEN) {
                console.log('Ignoring click - tile pending or WebSocket not ready');
                return;
            }

            // Generate sequence number for this click
            const sequence = ++sequenceNumber;

            // Add to pending clicks and update UI
            pendingClicks.set(index, { sequence });
            updateBoardDisplay();

            try {
                ws.send(JSON.stringify({
                    type: MessageType.MARK_TILE,
                    index: index,
                    sequence: sequence
                }));
            } catch (error) {
                console.error('Failed to send WebSocket message:', error);
                // Remove from pending clicks on error
                pendingClicks.delete(index);
                updateBoardDisplay();
            }
        }

        // Initialize the board
        function initBoard() {
            const boardElement = document.getElementById('bingoBoard');
            // Create 16 tiles
            for (let i = 0; i < 16; i++) {
                const tile = document.createElement('div');
                tile.className = 'bingo-tile';
                tile.id = `tile-${i}`;
                tile.textContent = `Tile ${i + 1}`;
                tile.onclick = () => markTile(i);
                boardElement.appendChild(tile);
            }
        }
    </script>
</body>
</html>
